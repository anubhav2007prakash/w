name: Firebase CI

on:
  push:
    branches: [main]
    paths:
      - "backend/firebase/**"
      - "firestore.rules"
      - "storage.rules"

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --only firestore,storage,functions --token "${{ secrets.FIREBASE_TOKEN }}"
