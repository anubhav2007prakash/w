version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../Dockerfile
      target: web-runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - MAUSAM_DB_PATH=/app/mausam.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
