services:
  - type: web
    name: mymausam-api
    runtime: python
    rootDir: MyMausam-2.0/backend/python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WEATHERSTACK_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
